# Lint, tests (real Postgres), an end-to-end pipeline run and the Docker stack.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rpi-${{ github.ref }}
  cancel-in-progress: true

env:
  RPI_DATABASE_URL: postgresql://rpi:rpi@localhost:5432/rpi
  RPI_TEST_PG_BASE: postgresql://rpi:rpi@localhost:5432
  PREFECT_LOGGING_LEVEL: WARNING
  PREFECT_SERVER_ANALYTICS_ENABLED: 'false'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install ruff
      - run: ruff check rpi
      - run: ruff format --check rpi

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: rpi, POSTGRES_PASSWORD: rpi, POSTGRES_DB: rpi}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rpi" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e ".[dev]"
      - name: Unit, integration and dbt tests
        run: python -m pytest rpi/tests -q

  pipeline-e2e:
    # The README promise: from nothing to a working API in a few commands.
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: rpi, POSTGRES_PASSWORD: rpi, POSTGRES_DB: rpi}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rpi" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e .
      - run: python -m rpi.cli migrate
      - run: python -m rpi.cli generate --days 45 --products 150
      - name: Run the pipeline (fails the job if the run fails)
        run: python -m rpi.cli run --as-of 2026-09-30
      - name: Matching quality against synthetic ground truth
        run: python -m rpi.cli evaluate-matching
      - name: API smoke test
        run: |
          uvicorn rpi.api.main:app --port 8000 &
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break || sleep 1; done
          curl -sf localhost:8000/v1/meta
          curl -sf "localhost:8000/v1/analytics/price-index" > /dev/null
      - name: Failure report
        if: failure()
        uses: actions/upload-artifact@v6
        with: {name: failure-reports, path: data/reports, if-no-files-found: ignore}

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose config -q
      - name: Build and run the whole stack
        run: |
          docker compose up --build --exit-code-from pipeline --abort-on-container-exit pipeline
          docker compose up -d api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf localhost:8000/v1/meta
      - if: always()
        run: docker compose down -v
